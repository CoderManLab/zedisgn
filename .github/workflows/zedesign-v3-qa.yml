name: ZEDESIGN V3 smoke tests
on:
  push:
    branches: [main, fix/zedesign-v38-savage-chat-frame]
  pull_request:
    paths:
      - "assistant.*"
      - "identity-system.css"
      - "*.html"
      - ".github/workflows/zedesign-v3-qa.yml"
      - "theme-optimized.html"
      - "theme-mono-produit.html"
      - "realisations.html"
      - "catalog-v3.*"
      - "portfolio-v3.css"
      - "floating-controls.*"
      - "data/module-status.json"
      - "scripts/check_v3_catalog.py"
  workflow_dispatch:
jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate catalogue structure
        run: python3 scripts/check_v3_catalog.py
      - name: Check JavaScript syntax
        run: |
          node --check assistant.js
          node --check catalog-v3.js
          node --check floating-controls.js
