name: ZEDESIGN V3 smoke tests
on:
  pull_request:
    paths:
      - "theme-optimized.html"
      - "theme-mono-produit.html"
      - "realisations.html"
      - "catalog-v3.*"
      - "portfolio-v3.css"
      - "data/module-status.json"
      - "scripts/check_v3_catalog.py"
  workflow_dispatch:
jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate catalogue structure
        run: python3 scripts/check_v3_catalog.py
      - name: Check JavaScript syntax
        run: node --check catalog-v3.js
